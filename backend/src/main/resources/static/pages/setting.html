<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings - KaamConnect</title><link rel="stylesheet" href="../css/style.css"></head>

<div class="dashboard-card"><h3>Change Password</h3><input id="newPassword" type="password" placeholder="New password" class="form-group" style="width:100%;padding:0.8rem"><button id="savePassword" class="btn-primary">Save</button></div>

<div class="dashboard-card"><h3>Notifications</h3><label><input id="notifToggle" type="checkbox"> Enable notifications</label></div>
<div class="dashboard-card"><h3>Language</h3><button class="btn-outline" onclick="openLanguageModal()">Change Language</button></div>
