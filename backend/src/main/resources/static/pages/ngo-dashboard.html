<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Dashboard - KaamConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar">
<div class="container">
<div class="nav-content">

<a href="../index.html" class="logo">
<span class="logo-icon">🔨</span>
<span class="logo-text">KAAMCONNECT</span>
</a>

<ul class="nav-links">
<li><a href="ngo-dashboard.html" class="active">Dashboard</a></li>
<li><a href="jobs.html">Jobs</a></li>
</ul>

<div class="nav-actions">
<button id="logoutBtn" class="logout-btn">Logout</button>
</div>

</div>
</div>
</nav>

<div class="page-header"><div class="container"><h1 class="page-title">NGO DASHBOARD</h1></div></div>

<section style="padding:2rem 0;">
    <div class="container">
        <div class="jobs-grid" style="grid-template-columns: repeat(4, minmax(160px, 1fr));" id="overviewCards">
            <div class="job-card"><h3 class="job-title">Total Workers</h3><p class="job-salary" id="totalWorkers">0</p></div>
            <div class="job-card"><h3 class="job-title">Verified Workers</h3><p class="job-salary" id="verifiedWorkers">0</p></div>
            <div class="job-card"><h3 class="job-title">Open Disputes</h3><p class="job-salary" id="openDisputes">0</p></div>
            <div class="job-card"><h3 class="job-title">Pending Payments</h3><p class="job-salary" id="pendingPaymentsCount">0</p></div>
        </div>

        <div class="auth-form" style="max-width:100%;margin-top:1.5rem;">
            <h3>Worker Verification Table</h3>
            <div id="workersTable"></div>
        </div>

        <div class="auth-form" style="max-width:100%;margin-top:1.5rem;">
            <h3>Payment Monitoring Table</h3>
            <div id="paymentsTable"></div>
        </div>

        <div class="auth-form" style="max-width:100%;margin-top:1.5rem;">
            <h3>Dispute Management Table</h3>
            <div id="disputesTable"></div>
        </div>

        <div class="auth-form" style="max-width:100%;margin-top:1.5rem;">
            <h3>Create Training Program</h3>
            <form id="trainingForm">
                <div class="form-group">
                    <label>Title</label>
                    <input id="trainingTitle" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="trainingDescription" required></textarea>
                </div>
                <button class="btn-primary" type="submit">Create Training Program</button>
            </form>
            <div id="trainingList" style="margin-top:1rem;"></div>
        </div>
    </div>
</section>

<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/logout.js"></script>
<script src="../js/ngo-dashboard.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    guardPage("NGO");
});
</script>
</body>
</html>
