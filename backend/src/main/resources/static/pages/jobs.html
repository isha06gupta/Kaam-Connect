<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs - KaamConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="nav-content">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🔨</span>
                <span class="logo-text">KAAMCONNECT</span>
            </a>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="jobs.html" class="active">Find Jobs</a></li>
                <li><a href="post-job.html">Post Job</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="ngo-portal.html">NGO Portal</a></li>
            </ul>

            <div class="nav-actions">
                <a href="login.html" class="btn-outline">Login</a>
                <a href="register.html" class="btn-primary">Register</a>
            </div>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <h1 class="page-title">FIND YOUR NEXT JOB</h1>
    </div>
</div>

<section class="search-section">
    <div class="container">
        <div class="search-bar">
            <input type="text" placeholder="Job title or keyword" id="searchKeyword">
            <input type="text" placeholder="Location" id="searchLocation">

            <select id="searchCategory">
                <option value="">All Categories</option>
                <option value="carpentry">Carpentry</option>
                <option value="painting">Painting</option>
                <option value="plumbing">Plumbing</option>
                <option value="electrical">Electrical</option>
                <option value="construction">Construction</option>
                <option value="housekeeping">Housekeeping</option>
                <option value="gardening">Gardening</option>
                <option value="delivery">Delivery</option>
            </select>

            <button class="btn-primary" onclick="searchJobs()">Search</button>
        </div>
    </div>
</section>

<section class="job-list-section">
    <div class="container">
        <div class="jobs-layout">

            <aside class="filters-sidebar">
                <h3>FILTERS</h3>

                <div class="filter-group">
                    <h4>Payment Type</h4>

                    <div class="filter-option">
                        <input type="checkbox" id="typeHourly">
                        <label for="typeHourly">Hourly</label>
                    </div>

                    <div class="filter-option">
                        <input type="checkbox" id="typeDaily">
                        <label for="typeDaily">Daily</label>
                    </div>

                    <div class="filter-option">
                        <input type="checkbox" id="typeWeekly">
                        <label for="typeWeekly">Weekly</label>
                    </div>

                    <div class="filter-option">
                        <input type="checkbox" id="typeFixed">
                        <label for="typeFixed">Fixed Project</label>
                    </div>
                </div>

                <div class="filter-group">
                    <h4>Salary Range</h4>

                    <div class="filter-option">
                        <input type="checkbox" id="salary1">
                        <label for="salary1">Below ₹500</label>
                    </div>

                    <div class="filter-option">
                        <input type="checkbox" id="salary2">
                        <label for="salary2">₹500 - ₹1000</label>
                    </div>

                    <div class="filter-option">
                        <input type="checkbox" id="salary3">
                        <label for="salary3">Above ₹1000</label>
                    </div>
                </div>

                <div class="filter-group">
                    <h4>Job Flags</h4>

                    <div class="filter-option">
                        <input type="checkbox" id="urgentOnly">
                        <label for="urgentOnly">Urgent Only</label>
                    </div>

                    <div class="filter-option">
                        <input type="checkbox" id="ngoVerifiedOnly">
                        <label for="ngoVerifiedOnly">NGO Verified Only</label>
                    </div>
                </div>
            </aside>

            <div class="jobs-content">
                <div class="jobs-grid" id="jobsGrid"></div>
            </div>

        </div>
    </div>
</section>

<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/jobs.js"></script>

</body>
</html>
