spring.application.name=kaam-connect-backend

# Default profile for local development
spring.profiles.active=dev

# Common JPA settings shared by profiles
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT settings
# Use a Base64-encoded key with at least 256 bits for HS256.
jwt.secret=${JWT_SECRET_BASE64:ZGV2LWRlZmF1bHQtanVzdC1mb3ItbG9jYWwtcnVuLWRldkRldkRldkRldkRldg==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
